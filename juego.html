<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juego SoyArte</title>
<link rel="shortcut icon" href="favicon_io/favicon.ico" type="image/x-icon">
<style>
:root{
  --bg-primary:#0f0e13;
  --bg-secondary:#1a1921;
  --bg-card:#23222b;
  --bg-hover:#2d2b38;
  --border-color:#3a3847;
  --text-primary:#f0edf6;
  --text-secondary:#a8a4b8;
  --accent:#7c5cfc;
  --accent-hover:#9b7ffc;
  --accent-glow:rgba(124,92,252,0.3);
  --danger:#fc5c7c;
  --success:#5cfc9b;
  --radius:12px;
  --shadow:0 8px 32px rgba(0,0,0,0.4);
  --transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
}

*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  overflow:hidden;
  height:100vh;
  width:100vw;
  user-select:none;
  touch-action:pan-y;
}

::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg-secondary);}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:10px;}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  background:rgba(15,14,19,0.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-color);
  flex-shrink:0;
  z-index:10;
  position:relative;
  min-height:48px;
}
.header-left{display:flex;align-items:center;gap:10px;}
.logo{font-weight:700;font-size:1rem;background:linear-gradient(135deg,var(--accent),#fc5c7c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px;white-space:nowrap;}
.logo-icon{font-size:1.2rem;-webkit-text-fill-color:initial;}
.header-actions{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;}
.header-actions .action-btn{padding:4px 8px;font-size:0.65rem;white-space:nowrap;}
.header-actions .action-btn span{display:inline;}

/* BOTONES */
.action-btn{
  padding:6px 12px;
  border:none;
  border-radius:var(--radius);
  font-weight:600;
  font-size:0.7rem;
  cursor:pointer;
  transition:var(--transition);
  text-transform:uppercase;
  letter-spacing:0.3px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  touch-action:manipulation;
  min-height:32px;
}
.action-btn.primary{background:var(--accent);color:white;}
.action-btn.primary:active{transform:scale(0.95);}
.action-btn.secondary{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);}
.action-btn.secondary:active{background:var(--bg-hover);}
.action-btn.danger{background:var(--danger);color:white;}
.action-btn.danger:active{transform:scale(0.95);}
.action-btn.success{background:var(--success);color:var(--bg-primary);}
.action-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important;}

/* MAIN */
.main-container{
  display:flex;
  height:calc(100vh - 48px);
  background:var(--bg-primary);
  overflow:hidden;
}

/* TOOLBAR LATERAL */
.toolbar{
  width:64px;
  background:var(--bg-secondary);
  border-right:1px solid var(--border-color);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:8px 4px;
  gap:2px;
  overflow-y:auto;
  flex-shrink:0;
  overflow-x:hidden;
}
.tool-btn{
  width:48px;
  height:48px;
  min-height:44px;
  border:none;
  border-radius:var(--radius);
  background:transparent;
  color:var(--text-secondary);
  font-size:1.2rem;
  cursor:pointer;
  transition:var(--transition);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  position:relative;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.tool-btn .label{font-size:0.4rem;font-weight:500;letter-spacing:0.2px;text-transform:uppercase;opacity:0.5;line-height:1;}
.tool-btn:active{transform:scale(0.92);}
.tool-btn.active{background:var(--accent);color:white;box-shadow:0 0 20px var(--accent-glow);}
.tool-btn.active .label{opacity:1;}
.tool-btn .shortcut{position:absolute;top:1px;right:3px;font-size:0.35rem;opacity:0.3;font-weight:600;}
.tool-divider{
  width:24px;
  height:1px;
  background:var(--border-color);
  margin:2px 0;
}

/* PANEL PROPIEDADES */
.properties{
  width:240px;
  background:var(--bg-secondary);
  border-left:1px solid var(--border-color);
  padding:12px;
  overflow-y:auto;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.prop-group{display:flex;flex-direction:column;gap:4px;}
.prop-label{font-size:0.55rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-secondary);}
.prop-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

/* COLORES */
.color-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
}
.color-swatch{
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  transition:var(--transition);
  position:relative;
  touch-action:manipulation;
  min-height:24px;
}
.color-swatch:active{transform:scale(0.9);}
.color-swatch.active{border-color:white;box-shadow:0 0 12px var(--accent-glow);}
.color-swatch .check{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:0.4rem;color:white;text-shadow:0 0 4px rgba(0,0,0,0.5);display:none;}
.color-swatch.active .check{display:block;}

input[type="color"]{
  width:100%;
  height:34px;
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  background:var(--bg-card);
  cursor:pointer;
  padding:2px;
  touch-action:manipulation;
}

/* SLIDERS */
.slider-container{display:flex;align-items:center;gap:8px;}
.slider-container input[type="range"]{
  flex:1;
  -webkit-appearance:none;
  height:4px;
  border-radius:4px;
  background:var(--border-color);
  outline:none;
  touch-action:manipulation;
}
.slider-container input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  box-shadow:0 0 12px var(--accent-glow);
}
.slider-container input[type="range"]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--accent);
  cursor:pointer;
  border:none;
}
.slider-value{
  min-width:28px;
  text-align:right;
  font-size:0.65rem;
  font-weight:600;
  color:var(--text-secondary);
}

/* AREA CANVAS */
.canvas-area{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:10px;
  background:var(--bg-primary);
  min-width:0;
}
.canvas-title{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
  flex-shrink:0;
}
.canvas-title input{
  flex:1;
  padding:6px 12px;
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  color:var(--text-primary);
  font-size:0.8rem;
  font-family:inherit;
  outline:none;
  transition:var(--transition);
  min-height:32px;
}
.canvas-title input:focus{border-color:var(--accent);box-shadow:0 0 20px var(--accent-glow);}

.canvas-wrapper{
  flex:1;
  background:var(--bg-card);
  border-radius:var(--radius);
  border:1px solid var(--border-color);
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  min-height:200px;
  touch-action:none;
}
.canvas-viewport{
  position:relative;
  line-height:0;
  transition:transform 0.2s ease;
  touch-action:none;
}
#mainCanvas{
  display:block;
  background:white;
  border-radius:4px;
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
  touch-action:none;
  max-width:100%;
  height:auto;
}
.cursor-preview{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.8);
  pointer-events:none;
  transform:translate(-50%,-50%);
  display:none;
  z-index:5;
  box-shadow:0 0 12px rgba(0,0,0,0.3);
}

/* STATUS BAR */
.status-bar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 2px;
  font-size:0.6rem;
  color:var(--text-secondary);
  flex-shrink:0;
  flex-wrap:wrap;
  margin-top:6px;
}
.status-bar .sep{width:1px;height:14px;background:var(--border-color);}
.status-item{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.status-item .icon{font-size:0.7rem;}
.zoom-controls{display:flex;gap:3px;align-items:center;}
.zoom-controls button{
  width:22px;height:22px;
  border:1px solid var(--border-color);
  border-radius:5px;
  background:var(--bg-card);
  color:var(--text-primary);
  cursor:pointer;
  transition:var(--transition);
  font-size:0.7rem;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:manipulation;
}
.zoom-controls button:active{transform:scale(0.9);}
.zoom-value{min-width:36px;text-align:center;font-weight:600;font-size:0.65rem;}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--bg-card);
  color:var(--text-primary);
  padding:10px 18px;
  border-radius:var(--radius);
  border:1px solid var(--border-color);
  font-size:0.75rem;
  font-weight:500;
  opacity:0;
  pointer-events:none;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  z-index:200;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
  max-width:90vw;
  text-align:center;
}
.toast.active{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:var(--danger);color:white;border-color:var(--danger);}
.toast.success{background:var(--success);color:var(--bg-primary);border-color:var(--success);}

/* RESPONSIVE */
@media(max-width:1024px){
  .properties{width:200px;}
  .toolbar{width:56px;}
  .tool-btn{width:44px;height:44px;font-size:1.1rem;}
  .tool-btn .label{display:none;}
}

@media(max-width:768px){
  .main-container{flex-direction:column;height:auto;overflow-y:auto;}
  .toolbar{
    width:100%;
    flex-direction:row;
    padding:6px 8px;
    border-right:none;
    border-bottom:1px solid var(--border-color);
    overflow-x:auto;
    gap:2px;
    flex-shrink:0;
    min-height:52px;
    height:auto;
    scrollbar-width:none;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .tool-btn{
    width:40px;
    height:40px;
    min-width:40px;
    font-size:1rem;
  }
  .tool-btn .label{display:none;}
  .tool-divider{width:1px;height:24px;min-width:1px;}
  
  .properties{
    width:100%;
    border-left:none;
    border-bottom:1px solid var(--border-color);
    flex-direction:row;
    flex-wrap:wrap;
    padding:8px 10px;
    gap:8px;
    max-height:180px;
    overflow-y:auto;
    flex-shrink:0;
  }
  .prop-group{
    flex:1 1 120px;
    min-width:100px;
    gap:3px;
  }
  .prop-label{font-size:0.5rem;}
  .color-grid{grid-template-columns:repeat(8,1fr);gap:2px;}
  .color-swatch{min-height:20px;}
  input[type="color"]{height:28px;}
  .slider-container input[type="range"]{height:3px;}
  .slider-container input[type="range"]::-webkit-slider-thumb{width:14px;height:14px;}
  .slider-value{font-size:0.55rem;min-width:24px;}
  
  .canvas-area{padding:6px;}
  .canvas-wrapper{padding:6px;min-height:150px;}
  .canvas-title input{font-size:0.7rem;padding:4px 8px;min-height:28px;}
  .status-bar{
    font-size:0.55rem;
    gap:6px;
    padding:4px 2px;
  }
  .status-bar .sep{display:none;}
  .zoom-controls button{width:20px;height:20px;font-size:0.6rem;}
  .zoom-value{min-width:30px;font-size:0.55rem;}
  
  .header{padding:6px 10px;min-height:40px;}
  .logo{font-size:0.85rem;}
  .header-actions .action-btn{padding:3px 6px;font-size:0.55rem;min-height:26px;}
  .header-actions .action-btn span{display:none;}
  
  .toast{font-size:0.65rem;padding:8px 14px;bottom:12px;}
}

@media(max-width:480px){
  .properties{
    max-height:150px;
    padding:6px 8px;
    gap:6px;
  }
  .prop-group{flex:1 1 90px;min-width:80px;}
  .color-grid{grid-template-columns:repeat(8,1fr);gap:2px;}
  .color-swatch{min-height:18px;border-width:1.5px;}
  .tool-btn{width:36px;height:36px;min-width:36px;font-size:0.9rem;}
  .toolbar{padding:4px 6px;min-height:44px;}
  .canvas-wrapper{padding:4px;min-height:120px;}
  .canvas-title input{font-size:0.65rem;padding:3px 6px;min-height:24px;}
}

@media(max-width:380px){
  .properties{max-height:130px;}
  .prop-group{flex:1 1 70px;min-width:65px;}
  .color-grid{grid-template-columns:repeat(6,1fr);}
  .status-bar .status-item .icon{display:none;}
  .zoom-value{min-width:24px;}
}

@supports(padding:max(0px)){
  .header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));}
  .toast{bottom:max(20px,env(safe-area-inset-bottom));}
}
</style>
</head>

<div class="main-container">

    <button class="tool-btn" data-tool="text" title="Texto">T<span class="label">Texto</span><span class="shortcut">T</span></button>

  <!-- PROPERTIES -->
  <div class="properties" id="properties">

    <div class="prop-group">

        <span class="slider-value" id="opacityValue">100</span>

    </div>

  <!-- CANVAS -->
  <div class="canvas-area">
    <div class="canvas-title">
      <input type="text" id="titleInput" placeholder="Título..." value="Mi obra maestra">
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="canvas-viewport" id="viewport">
        <canvas id="mainCanvas" width="1100" height="700"></canvas>
        <div class="cursor-preview" id="cursorPreview"></div>
      </div>

    <div class="status-bar">
      <div class="status-item"><span class="icon">📍</span> <span id="coords">—</span></div>

<script>
/* ============================================
   CONFIGURACIÓN Y ESTADO
============================================ */
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const viewport = document.getElementById('viewport');
const wrapper = document.getElementById('canvasWrapper');
const cursor = document.getElementById('cursorPreview');

const state = {
  tool: 'brush',
  color1: '#7c5cfc',
  color2: '#ffffff',
  size: 6,
  opacity: 1,
  fill: false,
  text: 'Arte',
  textSize: 32,
  font: 'Inter, sans-serif',
  zoom: 1,
  title: 'Mi obra maestra',
  isDrawing: false,
  startX: 0,
  startY: 0,
  lastX: 0,
  lastY: 0,
  history: [],
  historyIndex: -1,
  maxHistory: 30,
  mirrorMode: false,
  snapshot: null
};

/* ============================================
   INICIALIZACIÓN
============================================ */
function initCanvas() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistory();
  updateDimensions();
  updateZoom();
}

initCanvas();

/* ============================================
   PALETA DE COLORES
============================================ */
const palette = [
  '#7c5cfc', '#fc5c7c', '#5cfc9b', '#fcb45c',
  '#5ccbfc', '#fc5cfc', '#5cfc5c', '#fc5c5c',
  '#ffffff', '#000000', '#888888', '#ff6b6b',
  '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7',
  '#fd79a8', '#00b894', '#e17055', '#0984e3'
];

const colorGrid = document.getElementById('colorGrid');
palette.forEach(c => {
  const sw = document.createElement('button');
  sw.className = 'color-swatch' + (c === state.color1 ? ' active' : '');
  sw.style.background = c;
  sw.innerHTML = c === state.color1 ? '<span class="check">✓</span>' : '';
  sw.onclick = () => setColor(c, sw);
  colorGrid.appendChild(sw);
});

function setColor(color, el) {
  state.color1 = color;
  document.getElementById('colorPicker').value = color;
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.remove('active');
    s.innerHTML = '';
  });
  if (el) { el.classList.add('active'); el.innerHTML = '<span class="check">✓</span>'; }
}

document.getElementById('colorPicker').addEventListener('input', e => {
  setColor(e.target.value, document.querySelector(`.color-swatch[style*="${e.target.value}"]`));
});

document.getElementById('color2Picker').addEventListener('input', e => {
  state.color2 = e.target.value;
});

/* ============================================
   CONTROLES
============================================ */
document.getElementById('sizeSlider').addEventListener('input', e => {
  state.size = parseInt(e.target.value);
  document.getElementById('sizeValue').textContent = state.size;
});

document.getElementById('opacitySlider').addEventListener('input', e => {
  state.opacity = parseInt(e.target.value) / 100;
  document.getElementById('opacityValue').textContent = e.target.value;
});

document.getElementById('textSizeSlider').addEventListener('input', e => {
  state.textSize = parseInt(e.target.value);
  document.getElementById('textSizeValue').textContent = state.textSize;
});

document.getElementById('textInput').addEventListener('input', e => {
  state.text = e.target.value;
});

document.getElementById('fontSelect').addEventListener('change', e => {
  state.font = e.target.value;
});

document.querySelectorAll('[data-fill]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.fill = btn.dataset.fill === 'true';
    document.querySelectorAll('[data-fill]').forEach(b => {
      b.className = 'action-btn ' + (b.dataset.fill === String(state.fill) ? 'primary' : 'secondary');
    });
  });
});

/* ============================================
   HERRAMIENTAS
============================================ */
const toolNames = {
  brush: 'Pincel',
  eraser: 'Borrador',
  line: 'Línea',
  rect: 'Rectángulo',
  circle: 'Círculo',
  fill: 'Relleno',
  text: 'Texto',
  picker: 'Cuentagotas',
  spray: 'Spray',
  mirror: 'Simetría',
  filter: 'Filtros'
};

document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    if (tool === 'mirror') {
      state.mirrorMode = !state.mirrorMode;
      btn.classList.toggle('active');
      toast(state.mirrorMode ? '🪞 Simetría activada' : '🪞 Simetría desactivada', 'info');
      return;
    }
    if (tool === 'filter') {
      showFilterMenu();
      return;
    }
    setTool(tool);
  });
});

function setTool(tool) {
  state.tool = tool;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tool="${tool}"]`)?.classList.add('active');
  document.getElementById('textGroup').style.display = tool === 'text' ? 'block' : 'none';
  document.getElementById('currentTool').textContent = toolNames[tool] || tool;
  cursor.style.display = 'none';
}

// ATAJOS
document.addEventListener('keydown', e => {
  const inputs = ['INPUT', 'TEXTAREA', 'SELECT'];
  if (inputs.includes(document.activeElement.tagName)) return;
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    return;
  }
  const map = {
    'b': 'brush', 'e': 'eraser', 'l': 'line', 'r': 'rect',
    'c': 'circle', 'g': 'fill', 't': 'text', 'i': 'picker',
    'a': 'spray', 'm': 'mirror', 'f': 'filter'
  };
  if (map[e.key.toLowerCase()]) {
    e.preventDefault();
    const tool = map[e.key.toLowerCase()];
    if (tool === 'mirror') {
      state.mirrorMode = !state.mirrorMode;
      document.querySelector(`[data-tool="mirror"]`).classList.toggle('active');
      toast(state.mirrorMode ? '🪞 Simetría activada' : '🪞 Simetría desactivada', 'info');
      return;
    }
    if (tool === 'filter') { showFilterMenu(); return; }
    setTool(tool);
  }
  if (e.key === '+' || e.key === '=') { e.preventDefault(); changeZoom(0.1); }
  if (e.key === '-') { e.preventDefault(); changeZoom(-0.1); }
  if (e.key === '0') { e.preventDefault(); fitZoom(); }
});

/* ============================================
   FILTROS
============================================ */
function showFilterMenu() {
  const filters = [
    { name: 'Sepia', fn: applySepia },
    { name: 'Blanco & Negro', fn: applyGrayscale },
    { name: 'Invertir', fn: applyInvert },
    { name: 'Brillo +30%', fn: () => applyBrightness(1.3) },
    { name: 'Brillo -30%', fn: () => applyBrightness(0.7) },
    { name: 'Contraste +50%', fn: () => applyContrast(1.5) }
  ];
  const menu = document.createElement('div');
  menu.style.cssText = `
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--bg-secondary);border:1px solid var(--border-color);
    border-radius:var(--radius);padding:16px;z-index:300;
    box-shadow:var(--shadow);min-width:180px;max-width:90vw;
  `;
  menu.innerHTML = `<div style="font-weight:600;margin-bottom:10px;color:var(--text-secondary);font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;">🎨 Filtros</div>`;
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'action-btn secondary';
    btn.style.cssText = 'width:100%;justify-content:center;margin-bottom:4px;font-size:0.65rem;padding:4px 8px;';
    btn.textContent = f.name;
    btn.onclick = () => { f.fn(); document.body.removeChild(menu); };
    menu.appendChild(btn);
  });
  const close = document.createElement('button');
  close.className = 'action-btn secondary';
  close.style.cssText = 'width:100%;justify-content:center;margin-top:4px;font-size:0.65rem;padding:4px 8px;';
  close.textContent = '✕ Cerrar';
  close.onclick = () => document.body.removeChild(menu);
  menu.appendChild(close);
  document.body.appendChild(menu);
}

function applyFilter(callback) {
  saveHistory();
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  callback(imageData.data);
  ctx.putImageData(imageData, 0, 0);
  toast('✅ Filtro aplicado', 'success');
}

function applySepia(data) {
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    data[i] = Math.min(255, r*0.393 + g*0.769 + b*0.189);
    data[i+1] = Math.min(255, r*0.349 + g*0.686 + b*0.168);
    data[i+2] = Math.min(255, r*0.272 + g*0.534 + b*0.131);
  }
}

function applyGrayscale(data) {
  for (let i = 0; i < data.length; i += 4) {
    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
    data[i] = data[i+1] = data[i+2] = avg;
  }
}

function applyInvert(data) {
  for (let i = 0; i < data.length; i += 4) {
    data[i] = 255 - data[i];
    data[i+1] = 255 - data[i+1];
    data[i+2] = 255 - data[i+2];
  }
}

function applyBrightness(factor) {
  applyFilter(data => {
    for (let i = 0; i < data.length; i += 4) {
      data[i] = Math.min(255, data[i] * factor);
      data[i+1] = Math.min(255, data[i+1] * factor);
      data[i+2] = Math.min(255, data[i+2] * factor);
    }
  });
}

function applyContrast(factor) {
  applyFilter(data => {
    for (let i = 0; i < data.length; i += 4) {
      data[i] = Math.min(255, Math.max(0, ((data[i]/255 - 0.5) * factor + 0.5) * 255));
      data[i+1] = Math.min(255, Math.max(0, ((data[i+1]/255 - 0.5) * factor + 0.5) * 255));
      data[i+2] = Math.min(255, Math.max(0, ((data[i+2]/255 - 0.5) * factor + 0.5) * 255));
    }
  });
}

/* ============================================
   HISTORIAL
============================================ */
function saveHistory() {
  const data = canvas.toDataURL('image/png');
  state.history = state.history.slice(0, state.historyIndex + 1);
  state.history.push(data);
  if (state.history.length > state.maxHistory) state.history.shift();
  state.historyIndex = state.history.length - 1;
  updateHistoryButtons();
}

function undo() {
  if (state.historyIndex <= 0) return;
  state.historyIndex--;
  loadHistory();
}

function redo() {
  if (state.historyIndex >= state.history.length - 1) return;
  state.historyIndex++;
  loadHistory();
}

function loadHistory() {
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    updateHistoryButtons();
  };
  img.src = state.history[state.historyIndex];
}

function updateHistoryButtons() {
  document.getElementById('undoBtn').disabled = state.historyIndex <= 0;
  document.getElementById('redoBtn').disabled = state.historyIndex >= state.history.length - 1;
}

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

/* ============================================
   ZOOM
============================================ */
function updateZoom() {
  viewport.style.transform = `scale(${state.zoom})`;
  viewport.style.transformOrigin = 'top left';
  viewport.style.width = canvas.width * state.zoom + 'px';
  viewport.style.height = canvas.height * state.zoom + 'px';
  document.getElementById('zoomValue').textContent = Math.round(state.zoom * 100) + '%';
}

function changeZoom(delta) {
  state.zoom = Math.min(4, Math.max(0.15, state.zoom + delta));
  updateZoom();
}

function fitZoom() {
  const rect = wrapper.getBoundingClientRect();
  const pad = 20;
  const zx = (rect.width - pad) / canvas.width;
  const zy = (rect.height - pad) / canvas.height;
  state.zoom = Math.min(Math.min(zx, zy, 1), 1);
  updateZoom();
}

document.getElementById('zoomIn').addEventListener('click', () => changeZoom(0.1));
document.getElementById('zoomOut').addEventListener('click', () => changeZoom(-0.1));
document.getElementById('zoomFit').addEventListener('click', fitZoom);

wrapper.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    changeZoom(e.deltaY > 0 ? -0.1 : 0.1);
  }
}, { passive: false });

// Touch zoom con dos dedos
let lastTouchDist = 0;
wrapper.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    lastTouchDist = Math.sqrt(dx*dx + dy*dy);
  }
}, { passive: true });

wrapper.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastTouchDist > 0) {
      const delta = (dist - lastTouchDist) / 200;
      changeZoom(delta);
    }
    lastTouchDist = dist;
  }
}, { passive: false });

wrapper.addEventListener('touchend', e => {
  if (e.touches.length < 2) lastTouchDist = 0;
}, { passive: true });

/* ============================================
   DIBUJO
============================================ */
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
  return { x, y };
}

function updateCoords(e) {
  const { x, y } = getCanvasCoords(e);
  document.getElementById('coords').textContent = `${Math.round(x)}, ${Math.round(y)}`;
}

function updateCursor(e) {
  const show = ['brush', 'eraser', 'spray'].includes(state.tool);
  if (!show) { cursor.style.display = 'none'; return; }
  const rect = viewport.getBoundingClientRect();
  const touch = e.touches ? e.touches[0] : e;
  const size = (state.tool === 'eraser' ? state.size * 1.5 : state.size) * state.zoom;
  cursor.style.display = 'block';
  cursor.style.left = (touch.clientX - rect.left) + 'px';
  cursor.style.top = (touch.clientY - rect.top) + 'px';
  cursor.style.width = Math.max(Math.min(size, 80), 4) + 'px';
  cursor.style.height = Math.max(Math.min(size, 80), 4) + 'px';
  cursor.style.borderColor = state.tool === 'eraser' ? '#fc5c7c' : state.color1;
  cursor.style.opacity = Math.max(0.3, state.opacity);
}

function startDraw(e) {
  e.preventDefault();
  const { x, y } = getCanvasCoords(e);
  
  if (state.tool === 'fill') {
    saveHistory();
    floodFill(x, y, state.color1);
    return;
  }
  if (state.tool === 'picker') {
    pickColor(x, y);
    return;
  }
  if (state.tool === 'text') {
    saveHistory();
    placeText(x, y);
    saveHistory();
    return;
  }
  
  saveHistory();
  state.isDrawing = true;
  state.startX = x;
  state.startY = y;
  state.lastX = x;
  state.lastY = y;
  
  if (state.tool === 'brush' || state.tool === 'eraser') {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.save();
    ctx.globalAlpha = state.opacity;
    ctx.fillStyle = state.tool === 'eraser' ? '#ffffff' : state.color1;
    ctx.beginPath();
    ctx.arc(x, y, state.tool === 'eraser' ? state.size : state.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }
  if (state.tool === 'spray') {
    sprinkle(x, y);
  }
  if (['line', 'rect', 'circle'].includes(state.tool)) {
    state.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
}

function draw(e) {
  e.preventDefault();
  const { x, y } = getCanvasCoords(e);
  state.lastX = x;
  state.lastY = y;
  
  if (!state.isDrawing) {
    updateCoords(e);
    updateCursor(e);
    return;
  }
  
  if (state.tool === 'brush') {
    ctx.save();
    ctx.globalAlpha = state.opacity;
    ctx.strokeStyle = state.color1;
    ctx.lineWidth = state.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.restore();
    if (state.mirrorMode) {
      const mx = canvas.width - x;
      ctx.save();
      ctx.globalAlpha = state.opacity * 0.7;
      ctx.strokeStyle = state.color1;
      ctx.lineWidth = state.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineTo(mx, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mx, y);
      ctx.restore();
    }
  }
  
  if (state.tool === 'eraser') {
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = state.size * 1.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.restore();
  }
  
  if (state.tool === 'spray') {
    sprinkle(x, y);
    if (state.mirrorMode) sprinkle(canvas.width - x, y);
  }
  
  if (['line', 'rect', 'circle'].includes(state.tool)) {
    ctx.putImageData(state.snapshot, 0, 0);
    drawShape(state.startX, state.startY, x, y);
  }
  
  updateCoords(e);
}

function endDraw(e) {
  if (state.isDrawing) {
    state.isDrawing = false;
    if (state.history[state.historyIndex] !== canvas.toDataURL('image/png')) {
      saveHistory();
    }
  }
  state.snapshot = null;
}

function drawShape(x1, y1, x2, y2) {
  ctx.save();
  ctx.globalAlpha = state.opacity;
  ctx.strokeStyle = state.color1;
  ctx.fillStyle = state.fill ? state.color1 : state.color2;
  ctx.lineWidth = state.size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  if (state.tool === 'line') {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  if (state.tool === 'rect') {
    const w = x2 - x1, h = y2 - y1;
    ctx.beginPath();
    ctx.rect(x1, y1, w, h);
    if (state.fill) ctx.fill();
    ctx.stroke();
    if (state.mirrorMode) {
      const mx = canvas.width - x1;
      ctx.beginPath();
      ctx.rect(mx - w, y1, w, h);
      if (state.fill) ctx.fill();
      ctx.stroke();
    }
  }
  if (state.tool === 'circle') {
    const rx = Math.abs(x2 - x1) / 2;
    const ry = Math.abs(y2 - y1) / 2;
    const cx = x1 + (x2 - x1) / 2;
    const cy = y1 + (y2 - y1) / 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI*2);
    if (state.fill) ctx.fill();
    ctx.stroke();
    if (state.mirrorMode) {
      const mcx = canvas.width - cx;
      ctx.beginPath();
      ctx.ellipse(mcx, cy, Math.max(rx, 1), Math.max(ry, 1), 0, 0, Math.PI*2);
      if (state.fill) ctx.fill();
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ============================================
   HERRAMIENTAS ESPECIALES
============================================ */
function floodFill(x, y, color) {
  const w = canvas.width, h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const idx = (Math.floor(y) * w + Math.floor(x)) * 4;
  const targetR = data[idx], targetG = data[idx+1], targetB = data[idx+2];
  const fill = hexToRgb(color);
  if (targetR === fill.r && targetG === fill.g && targetB === fill.b) return;
  
  const visited = new Uint8Array(w * h);
  const stack = [[Math.floor(x), Math.floor(y)]];
  const threshold = 30;
  
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    const pos = cy * w + cx;
    if (visited[pos]) continue;
    const i = pos * 4;
    if (Math.abs(data[i] - targetR) > threshold || 
        Math.abs(data[i+1] - targetG) > threshold || 
        Math.abs(data[i+2] - targetB) > threshold) continue;
    visited[pos] = 1;
    data[i] = fill.r;
    data[i+1] = fill.g;
    data[i+2] = fill.b;
    data[i+3] = Math.round(state.opacity * 255);
    stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
  }
  ctx.putImageData(imageData, 0, 0);
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? {
    r: parseInt(result[1], 16),
    g: parseInt(result[2], 16),
    b: parseInt(result[3], 16)
  } : { r: 0, g: 0, b: 0 };
}

function pickColor(x, y) {
  const px = ctx.getImageData(Math.floor(x), Math.floor(y), 1, 1).data;
  const hex = '#' + [px[0], px[1], px[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  setColor(hex, document.querySelector(`.color-swatch[style*="${hex}"]`));
  toast('🎨 Color tomado: ' + hex, 'info');
}

function placeText(x, y) {
  ctx.save();
  ctx.globalAlpha = state.opacity;
  ctx.fillStyle = state.color1;
  ctx.font = `${state.textSize}px ${state.font}`;
  ctx.textBaseline = 'top';
  ctx.fillText(state.text || 'Arte', x, y);
  ctx.restore();
}

function sprinkle(x, y) {
  const count = Math.max(15, state.size * 3);
  const radius = state.size * 1.8;
  ctx.save();
  ctx.globalAlpha = state.opacity * 0.15;
  ctx.fillStyle = state.color1;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.random() * radius;
    ctx.beginPath();
    ctx.arc(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

/* ============================================
   EVENTOS DEL CANVAS
============================================ */
canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', draw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);

canvas.addEventListener('touchstart', startDraw, { passive: false });
canvas.addEventListener('touchmove', draw, { passive: false });
canvas.addEventListener('touchend', endDraw, { passive: false });

canvas.addEventListener('mousemove', (e) => {
  if (!state.isDrawing) {
    updateCoords(e);
    updateCursor(e);
  }
});

canvas.addEventListener('mouseleave', () => {
  cursor.style.display = 'none';
});

/* ============================================
   REDIMENSIONAR LIENZO
============================================ */
document.getElementById('resizeBtn').addEventListener('click', () => {
  const w = parseInt(document.getElementById('canvasWidth').value) || canvas.width;
  const h = parseInt(document.getElementById('canvasHeight').value) || canvas.height;
  if (w === canvas.width && h === canvas.height) return;
  const data = canvas.toDataURL('image/png');
  saveHistory();
  canvas.width = Math.max(100, Math.min(4000, w));
  canvas.height = Math.max(100, Math.min(4000, h));
  const img = new Image();
  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    updateDimensions();
    fitZoom();
    toast('📐 Lienzo redimensionado', 'success');
  };
  img.src = data;
});

function updateDimensions() {
  document.getElementById('dimensions').textContent = `${canvas.width}×${canvas.height}`;
  document.getElementById('canvasWidth').value = canvas.width;
  document.getElementById('canvasHeight').value = canvas.height;
}

/* ============================================
   NUEVO / EXPORTAR
============================================ */
document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('¿Borrar todo el lienzo?')) {
    saveHistory();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    saveHistory();
    toast('🗑️ Lienzo limpiado', 'info');
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const link = document.createElement('a');
  const title = document.getElementById('titleInput').value || 'mi-obra';
  link.download = title.replace(/\s+/g, '-') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('⬇️ Exportado como PNG', 'success');
});

/* ============================================
   TOAST
============================================ */
function toast(message, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast';
  if (type === 'error') el.classList.add('error');
  if (type === 'success') el.classList.add('success');
  el.classList.add('active');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('active'), 3000);
}

/* ============================================
   INICIALIZACIÓN FINAL
============================================ */
window.addEventListener('load', () => {
  setTimeout(fitZoom, 100);
  saveHistory();
  updateHistoryButtons();
});

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(fitZoom, 300);
});
