<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoyo al Proyecto</title>

    <link rel="stylesheet" href="../styles/apoyanos.css">
</head>

<body>

  <div class="card">

    <h1>Apoya este proyecto ❤️</h1>
    <p>Elige un monto y método de pago</p>

    <!-- Montos -->
    <div class="amounts">
      <button class="amount" data-value="1">$1</button>
      <button class="amount" data-value="5">$5</button>
      <button class="amount" data-value="10">$10</button>
      <button class="amount" data-value="20">$20</button>
    </div>

    <!-- Botón donar -->
    <button id="donateBtn">Donar ahora 💖</button>

  </div>

  <script src="JavaScrip/apoyanos.js"></script>

</body>
</html>
