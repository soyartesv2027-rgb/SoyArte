<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <!-- Bootstrap PRIMERO, luego tu CSS para que puedas sobreescribirlo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <main class="contenedorLogin"> 
        <h1 class="titulo">¡Bienvenido de Nuevo!</h1>
        <form class="form" method="POST" action="../php-conexion/login.php">   
            <div class="inputBlock"> 
                <label for="floatingInput">Correo Electrónico:</label><br>
                
                <input type="email" class="inputs" id="floatingInput" 
                       placeholder="name@example.com" name="correo">  
            </div> 
            <div class="inputBlock"> 
                <label for="floatingPassword">Contraseña:</label>
                
                <input type="password" class="inputs" id="floatingPassword" 
                       placeholder="Ingresa tu contraseña" name="password"> 
            </div>
            <div class="inputBlock">
                <a href="" class="forget-password">¿Olvidaste tu contraseña?</a>
            </div>  
            <div class="inputBlock">
                <button class="btn btn-primary" type="submit">Iniciar Sesión</button> 
                <p class="opciones">------- O -------</p>
                
                <div class="d-flex justify-content-center">
                    <button class="button1" type="button">
                        <img src="img/google.png" alt="google">
                        Continúa con Google
                    </button>
                </div>
            </div>
        </form> 
        <div class="register">
            <p>¿No tienes una cuenta?</p>
            <a href="register.html">Regístrate aquí</a>
        </div>
    </main>
</body>
</html>
