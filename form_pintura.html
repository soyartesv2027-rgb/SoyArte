<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintura</title>

    <link rel="stylesheet" href="styles/form_pintura.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<a href="pinturas.php">
    <div class="flecha">
        <i class="fa-solid fa-arrow-left"></i>
    </div>
</a>

<form action="guardar-pintura.php"
      method="POST"
      enctype="multipart/form-data">

    <h2>Publicar una pintura</h2>

    <label>Foto de la pintura</label>
    <input type="file" name="imagen" required>

    <label>Nombre de la pintura</label>
    <input type="text" name="nombre_pintura" required>

    <label>Autor</label>
    <input type="text" name="autor" required>

    <label>Descripción</label>
    <textarea name="descripcion"
              rows="5"
              required></textarea>

    <button type="submit">
        Publicar
    </button>

</form>

</body>
</html>
